[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-doctor"
version = "0.1.0"
description = "Health monitoring for web-live agent benchmarks: detects benchmark decay (temporal, content drift, access, ambiguity) task by task."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Max Penso" }]
keywords = ["benchmark", "web agents", "evaluation", "decay", "webvoyager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]

# La couche L1 ne dépend que de la bibliothèque standard.
dependencies = []

[project.optional-dependencies]
probe = ["requests>=2.31"]        # L2, canal HTTP direct
browser = ["playwright>=1.44"]    # L2, canal navigateur local
llm = ["httpx>=0.27"]             # L3
figures = ["matplotlib>=3.8", "numpy>=1.26"]   # figures/make_figures.py
stats = ["numpy>=1.26", "scipy>=1.11"]         # experiments/validation_hors_echantillon.py
dev = ["pytest>=8.0"]

[project.scripts]
bdoctor = "benchmark_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/jolehuit/benchmark-doctor"

[tool.setuptools.packages.find]
include = ["benchmark_doctor*"]

# Les étiquettes manuelles sont lues par `Path(__file__).with_name(...)` : sans cette
# déclaration, une installation non éditable livre le module `taxonomy` sans son fichier
# de données et `load_manual_labels()` lève FileNotFoundError.
[tool.setuptools.package-data]
"benchmark_doctor.ground_truth" = ["magnitude_reason_labels.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
